<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>BALL x PIT Evolutions-Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<style>
/* Layout: sticky progress header; run picker (multi-select inventory) on top; below: pick recommendations, buildable now, still possible — or the full overview grouped by tier. Detail modal for any sprite. Light theme only, borrowed from the chart: pit-black sprite tiles on terracotta rules, mint for "new". */
:root{
  --bg:#efe3da; --bg2:#f8efe8; --bg3:#fff8f3; --tile:#1e181a; --line:#b57d68; --line2:#dcc3b7;
  --fg:#2a1d18; --fg2:#6b534a; --fg3:#9b8077;
  --accent:#b35f2a; --accent2:#8a4a22; --mint:#1f8a6e; --mint2:#9fe9d0; --ok:#2d7a44; --ok2:#9fd9ae; --danger:#b03e2f; --warn:#9a6a12;
  --font-display:"Silkscreen","Courier New",monospace; --font-body:"IBM Plex Sans",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.sprite{image-rendering:pixelated;image-rendering:crisp-edges;background:var(--tile);border-radius:6px;display:block}
h2{font-family:var(--font-display);font-size:12px;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;max-width:1240px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding-block:12px 10px}
@media (max-width:700px){header.top{position:static}}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:var(--font-display);font-size:18px;letter-spacing:.02em;margin:0;text-wrap:balance}
h1 .x{color:var(--accent)}
.meta{font-family:var(--font-mono);font-size:11px;color:var(--fg3);letter-spacing:.04em;text-transform:uppercase}
.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;margin-top:10px}
.prog{display:flex;flex-direction:column;gap:4px;min-width:0}
.prog .lbl{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--fg2);font-variant-numeric:tabular-nums}
.prog .lbl b{color:var(--fg);font-weight:500}
.bar{height:8px;background:var(--line2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.bar.total i{background:var(--mint)}

.modes{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.mright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mleft{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.lnk{font-size:12px;color:var(--fg3);text-decoration:underline dotted;text-underline-offset:3px}
.lnk:hover,.lnk.on{color:var(--accent)}
.seg.big button{font-family:var(--font-display);font-size:12px;padding:9px 16px}
.sub2 .cnt{font-family:var(--font-mono);color:var(--accent)}
.sub2.g{color:var(--ok)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.seg{display:flex;border:2px solid var(--line2);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{padding:6px 11px;font-size:13px;color:var(--fg2);white-space:nowrap}
.seg button.on{background:var(--accent);color:#1a120d;font-weight:600}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg2);padding:6px 10px;border:2px solid var(--line2);border-radius:6px;cursor:pointer;user-select:none;white-space:nowrap}
.chk.on{border-color:var(--mint);color:var(--fg)}
.chk .star{color:var(--mint)}
input.search{flex:1 1 180px;min-width:0;padding:7px 10px;border:2px solid var(--line2);border-radius:6px;background:var(--bg2);color:var(--fg);font-size:13px}
input.search::placeholder{color:var(--fg3)}
.btn{padding:5px 10px;border:2px solid var(--line2);border-radius:6px;font-size:12px;color:var(--fg2);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--fg)}
.btn.primary{border-color:var(--accent);color:var(--fg)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#1a120d;font-weight:600;padding:7px 14px}
.btn.solid:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.warn{color:var(--danger)}

section.picker{margin-top:16px;border:2px solid var(--line2);border-radius:8px;padding:12px;background:var(--bg2)}
.picker .head{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.picker .head small{font-weight:400;font-size:13px;color:var(--fg2);flex:1 1 260px}
.grp{margin-top:12px}
.grp .gl{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);display:flex;align-items:center;gap:10px}
.grp .gl button{font-family:var(--font-body);text-transform:none;letter-spacing:0;font-size:12px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{position:relative;width:94px;border:2px solid transparent;border-radius:8px;padding:3px 2px 2px;transition:opacity .15s;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent}
.chip img{width:64px;height:64px}
.chip .cl{font-size:11px;line-height:1.15;color:var(--fg2);text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.3em;overflow-wrap:break-word;hyphens:auto}
.chip.sel{border-color:var(--accent);background:var(--bg3)}
.chip.sel .cl{color:var(--fg);font-weight:600}
.chip.dim img{opacity:.55;filter:saturate(.6)}
.chip.dim .cl{color:var(--fg3)}
.chip.sel::after{content:"✓";position:absolute;right:6px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#1a120d;font-size:12px;line-height:18px;text-align:center;font-weight:700}
.chip{cursor:pointer}
.chipw{display:inline-flex;flex-direction:column;align-items:stretch;width:94px;border:2px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--bg)}
.chipw:has(.chip.sel){border-color:var(--accent);background:var(--bg3)}
.chipw .chip{width:100%;border:0;border-radius:0;padding:6px 2px 4px}
.chipw .chip.sel{background:transparent}
.chipw .info{height:26px;font-size:15px;line-height:1;color:var(--fg2);border-top:1px solid var(--line2);background:var(--bg2)}
.chipw .info:hover{color:var(--accent);background:var(--bg3)}
.chipw .info:active{background:var(--line2)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg2)}
.steps li{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;padding:2px 0}
.steps li::marker{color:var(--fg3);font-family:var(--font-mono)}
.steps img{width:30px;height:30px;border-radius:5px;cursor:pointer}
.steps .plus{font-family:var(--font-mono);color:var(--fg3)}
.steps .arr{color:var(--accent);font-weight:600}
.steps .sn{color:var(--fg)}
.steps li.p .sn{color:var(--warn)}
.steps .si{display:inline-flex;padding:3px}
.steps .sr .si:first-child{padding-left:0}
.steps .sr{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.steps img{width:26px;height:26px}
.steps .si.need img{outline:3px solid var(--danger);outline-offset:2px}
.steps .si.have img{outline:3px solid var(--accent);outline-offset:2px}
.steps .star{font-size:9px;line-height:13px}
.why .g{color:var(--ok);font-weight:600}
.why .o{color:var(--accent);font-weight:600}
.why .dl{display:flex;flex-direction:column;gap:1px;margin-top:3px}
.why .nf{margin-top:4px}
.card .area.why{gap:2px}
.why .dm{padding-left:22px;color:var(--fg3);font-style:italic;display:flex;flex-wrap:wrap;gap:3px 5px;align-items:center}
.why .dm .dn{font-style:normal}
.why .dn,.lvl .dn{display:inline-flex;align-items:center;gap:3px;cursor:pointer;color:var(--fg)}
.why img,.lvl img{width:20px;height:20px;border-radius:3px}
.why i{color:var(--fg3)}
.card.mergeable{border-color:var(--accent2)}
.lvl ol{margin:8px 0 0;padding:0;list-style:none;counter-reset:lv;display:flex;flex-direction:column;gap:12px}
.lvl li{display:grid;grid-template-columns:18px minmax(0,1fr);column-gap:8px;counter-increment:lv}
.lvl li::before{content:counter(lv) ".";grid-row:1;align-self:center;color:var(--fg3);font-family:var(--font-mono);font-size:12px}
.lvl li>.lm,.lvl li>.ln{grid-column:2}
.lvl .lm{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;color:var(--fg)}
.lvl .lm .plus{color:var(--fg3);font-family:var(--font-mono)}
.lvl .ln{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:12px;color:var(--fg3)}
.lvl .st{font-family:var(--font-mono);font-size:11px;letter-spacing:.02em;padding:2px 8px;border-radius:999px;margin-left:4px}
.lvl .st.ok{color:var(--ok);background:color-mix(in srgb,var(--ok2) 30%,transparent)}
.lvl .st.miss{color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.lvl .ln .o{color:var(--accent);font-weight:600}
.lvl .ln img{width:20px;height:20px}
.lvl .lt{font-weight:600;color:var(--fg)}
.lvl{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--fg2);border:2px solid var(--line2);border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px 14px;margin:0 0 14px;background:var(--bg2)}
.lvl .arr{color:var(--accent);font-weight:700}
.lvl .lm img{width:28px;height:28px}
.lvl .dn{gap:6px}
.hist .umsg{flex-basis:100%;font-size:12px;color:var(--fg);background:var(--bg3);border-left:3px solid var(--accent);padding:6px 10px;border-radius:4px}
#toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;background:var(--bg3);color:var(--fg);border:2px solid var(--accent);border-radius:12px;padding:10px 40px 14px 12px;overflow:hidden;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;max-width:min(720px,calc(100vw - 32px));font-size:12px;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media (min-width:900px){#toast{left:auto;right:max(20px,env(safe-area-inset-right,0px));transform:translate(0,20px);max-width:600px;min-width:420px}#toast.on{transform:translate(0,0)}}
#toast .tbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line2);border-radius:0 0 10px 10px;overflow:hidden}
#toast .tbar i{display:block;height:100%;width:100%;background:var(--accent)}
#toast.hold .tbar i{animation-play-state:paused!important}
@keyframes tcount{from{width:100%}to{width:0}}
@media (max-width:899px){#toast{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));transform:translate(0,20px);max-width:none;padding-right:36px}#toast.on{transform:none}.tsp{width:56px}.tsp img{width:40px;height:40px}}
#toast .tx{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;min-width:0}
#toast .ta{display:flex;gap:6px;flex-wrap:wrap}
#toast .tclose{position:absolute;right:6px;top:6px;font-size:18px;line-height:1;color:var(--fg2);padding:2px 6px}
.tsp{display:inline-flex;flex-direction:column;align-items:center;gap:2px;width:64px;cursor:pointer}
.tsp img{width:44px;height:44px;border-radius:6px;border:2px solid transparent}
.tsp span{font-size:10px;line-height:1.1;text-align:center;color:var(--fg2);max-width:64px}
.tsp.in img{border-color:var(--accent)} .tsp.new img{border-color:var(--ok)} .tsp.out img{opacity:.55;filter:saturate(.5)}
#toast .tarr{font-size:18px;color:var(--fg3)}
#toast .tl{font-family:var(--font-mono);font-size:11px;color:var(--fg2);white-space:nowrap}
#toast .tl.ok{color:var(--ok)}
#toast .tl.miss{color:var(--danger);white-space:normal}
#toast .thead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-basis:100%}
#toast .tnext{flex-basis:100%;font-size:11px;color:var(--fg3);font-family:var(--font-mono);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
#toast .trow{display:flex;gap:4px;align-items:center;flex-wrap:wrap;flex-basis:100%;padding:4px 0;border-top:1px dashed var(--line2)}
#toast .trow .btn{margin-left:4px}
.tsp.miss img{border-color:var(--danger);opacity:.75} .tsp.miss span{color:var(--danger)}
#toast .tx{flex-direction:column;align-items:stretch;flex:1 1 100%}
#toast .ta{align-self:flex-start}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
.hist{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hist .hlist{flex-basis:100%;margin:4px 0 0;padding:0 0 0 18px;font-size:12px;color:var(--fg2);display:flex;flex-direction:column;gap:3px;max-height:200px;overflow:auto}
.hist .hlist li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist .hlist li:first-child span{color:var(--fg)}
.tg{font-family:var(--font-body);text-transform:none;letter-spacing:0;font-size:12px;color:var(--accent)}
.warnTxt{color:var(--warn)}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}60%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.card.flash{animation:flash 1.6s ease-out 2}
.chip.unseen::before{content:"";position:absolute;left:8px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--mint)}
.picker .hint{margin:12px 0 0;font-size:13px;color:var(--fg2);display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.picker .hint b{color:var(--fg);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);display:inline-block;margin-right:4px}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}
.legend .sw{width:14px;height:14px;border-radius:4px;display:inline-block;background:var(--tile);opacity:.55}

.res{margin-top:16px;scroll-margin-top:110px}
html,body{overflow-anchor:none}
@media (max-width:700px){.res{scroll-margin-top:12px}}
.res h2{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.res h2 .n{font-family:var(--font-mono);font-size:11px;color:var(--accent)}
.res h2 small{font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--fg3);flex-basis:100%}
.res+.res{margin-top:22px}
.res h3.sub2{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);margin:14px 0 6px;display:flex;align-items:center;gap:10px}
.res h3.sub2 .ln{flex:1;height:2px;background:var(--line2)}
.status{margin-top:16px;font-family:var(--font-mono);font-size:12px;color:var(--fg2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.status b{color:var(--fg);font-weight:500}
.tierhead{margin-top:22px;display:flex;align-items:center;gap:12px}
.tierhead h2{font-size:13px}
.tierhead .n{font-family:var(--font-mono);font-size:11px;color:var(--fg3)}
.tierhead .ln{flex:1;height:2px;background:var(--line2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:10px}
.card{display:flex;flex-direction:column;gap:0;padding:10px;border:2px solid var(--line2);border-radius:8px;background:var(--bg2);text-align:left;position:relative;min-width:0}
.card .ch{display:flex;gap:12px;align-items:center;padding-bottom:10px}
.card .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.card .big{position:relative;cursor:zoom-in;flex:0 0 auto}
.card .big img{width:72px;height:72px}
.card .tick{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--ok2);color:#fff;text-align:center;line-height:24px;font-weight:700;font-size:14px;border:2px solid var(--bg2);display:none}
.card .area{border-top:2px solid var(--line2);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.card .area.cond .cx{font-size:12px;color:var(--fg2);line-height:1.4}
.ctr{display:flex;flex-wrap:wrap;gap:4px 12px}
.ctr .dn,.cnow .dn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--fg);font-size:12px}
.ctr img,.cnow img{width:24px;height:24px;border-radius:4px}
.cnow{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 10px;border-radius:6px;background:color-mix(in srgb,var(--warn) 14%,transparent)}
.cnow b{font-weight:600;color:var(--warn)}
.dcond .area.cond{border-top:2px solid var(--line2);margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.card .area.note{font-size:11px;color:var(--fg3);line-height:1.3}
.card .area.cx{font-size:11px;color:var(--fg2);line-height:1.4}
.card .ml{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg3)}
.card .ml.ok{color:var(--ok)} .card .ml.warn{color:var(--warn)}
.card .foot{border-top:2px solid var(--line2);padding-top:10px;margin-top:auto;display:flex}
.card .foot .merge{flex:1}
.card .recs{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-start}
.card .recs .recipe{flex-wrap:nowrap}
.card .mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 10px}
.card .mi{display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-width:0}
.card .mi:hover b{color:var(--accent)}
.card .mi img{width:34px;height:34px;border-radius:6px;flex:0 0 auto}
.card .mi b{font-weight:500;color:var(--fg);font-size:13px;min-width:0;overflow-wrap:anywhere}
.card .mi i{color:var(--fg3);font-size:11px}
.card .kind{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3)}
.card.chain{border-style:dashed;padding-top:16px}
.card.done{border-color:var(--ok2)}
.card.done .big img{filter:saturate(.35) brightness(.7)}
.card.done .tick{display:block}
.card .name{font-family:var(--font-display);font-size:11px;line-height:1.35;cursor:pointer}
.card .name:hover{color:var(--accent)}
.card.done .name{color:var(--fg2)}
.card .alt{font-size:11px;color:var(--fg3)}
.star.post{color:var(--fg3);border-color:var(--line)}
.star{color:var(--mint);font-family:var(--font-body);font-size:11px;border:1px solid var(--mint);border-radius:4px;padding:0 4px;line-height:16px;font-weight:400}
.recipe{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.recipe .ing{display:flex;flex-direction:column;align-items:center;gap:2px;width:44px;cursor:pointer}
.recipe .ing img{width:34px;height:34px;border-radius:4px;border:2px solid transparent;margin:3px}
.recipe .ing.hl img{border-color:transparent;outline:3px solid var(--accent);outline-offset:2px}
.recipe .ing.miss img{border-color:transparent;outline:3px solid var(--danger);outline-offset:2px;opacity:.75}
.recipe .ing span{font-size:9px;line-height:1.1;color:var(--fg3);text-align:center;max-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recipe .ing.hl span{color:var(--fg)}
.recipe .plus{font-family:var(--font-mono);color:var(--fg3);font-size:12px;align-self:flex-start;margin-top:10px}

// Every fusion consumes its ingredients, so requirements are multisets. expand() lists every way to build n down to
// things you hold (inventory items are leaves) or base parts; plan() picks per evolution the way with the fewest missing parts.
function expand(n,inv,memo){
  if(inv[n]>0||!isEvo(n)) return [{req:{[n]:1},how:{}}];
  if(memo[n]) return memo[n]; const out=[];
  for(const r of byName[n].recipes){ let combos=[{req:{},how:{}}];
    for(const i of r){ const exs=expand(i,inv,memo); const next=[];
      for(const c of combos) for(const x of exs){ const req={...c.req}; for(const k in x.req) req[k]=(req[k]||0)+x.req[k]; next.push({req,how:{...c.how,...x.how}}); }
      combos=next; }
    combos.forEach(c=>{ c.how={...c.how,[n]:r}; out.push(c); }); }
  memo[n]=out; return out;
}
function plan(inv){ const memo={}, res={};
  for(const e of DATA.evos){ if(inv[e.name]>0){ res[e.name]={have:true,total:0,missing:{},how:{}}; continue; }
    let best=null, alts=[];
    for(const c of expand(e.name,inv,memo)){ const missing={}; let total=0;
      for(const k in c.req){ const m=Math.max(0,c.req[k]-(inv[k]||0)); if(m){ missing[k]=m; total+=m; } }
      const x={total,missing,how:c.how,req:c.req};
      if(!best||total<best.total){ best=x; alts=[x]; } else if(total===best.total) alts.push(x); }
    // alts: every equally short way (e.g. Assassin via Ghost or Dark), so each of their parts counts as a pick
    if(best) best.alts=alts; res[e.name]=best; }
  return res;
}

    return `<div class="pr ${cls} ${have.length?'run':''}" data-open="${esc(e.name)}">${mini(e.name)}<span class="prn">${esc(nm(e.name))}</span>${lines?`<span class="prp">${lines}</span>`:''}</div>`; };
  const more=n=>n>0?`<span class="pc more">${T('pMore')(n)}</span>`:'';
  const direct=s.direct.length?`<div class="area direct"><div class="ml ok">${T('direct')}</div><div class="plist">${s.direct.slice(0,4).map(t=>row(t,'d')).join('')}${more(s.direct.length-4)}</div></div>`:'';
  const near=s.near.length?`<div class="area near"><div class="ml warn">${T('near')}</div><div class="plist">${s.near.slice(0,4).map(t=>row(t,'n')).join('')}${more(s.near.length-4)}</div></div>`:'';
  return `<div class="card pick">
    <div class="ch"><div class="big" data-open="${esc(s.x)}"><img class="sprite" src="${spr(s.x)}" alt=""></div>
      <div class="ct"><div class="name" data-open="${esc(s.x)}">${esc(nm(s.x))}</div><button class="btn solid takebtn" data-ing="${esc(s.x)}">+ ${T('selectBtn')}</button></div></div>
    ${direct}${near}</div>`;
}
function renderMain(){
  const main=$('#main');
  if(ui.mode==='lex'){
    const groups=TIERS.filter(t=>ui.tier==='all'||String(t.t)===String(ui.tier));
    let html=''; let total=0;
    for(const t of groups){ const all=ALL.filter(e=>e.tier===t.t); const es=all.filter(passFilters);
      // same order as the in-game encyclopedia: alphabetical by English name, whatever the UI language
      es.sort((x,y)=>(x.post-y.post)||x.name.localeCompare(y.name,'en')); total+=es.length; const miss=all.filter(e=>!done.has(e.id)).length;
      html+=`<div class="tierhead"><h2>${tierLabel(t.t)}</h2><span class="n">${miss===0?T('complete'):T('missOf')(miss,all.length)} · ${esc(T('tierSub')[t.t])}</span><span class="ln"></span></div>`;
      html+=es.length?`<div class="grid">${es.map(e=>e.kind?entryCardHtml(e):cardHtml(e)).join('')}</div>`:`<div class="empty">${ui.filter==='missing'&&!ui.q&&ui.newF==='all'?T('allFound'):T('nothing')}</div>`; }
    main.innerHTML=`<div class="status"><span>${T('shown')(total)}</span><span>${T('legendCards')}</span></div>`+html;
    return;
  }
  // ---- run mode: no library filters apply here ----
  const P=plan(ui.sel); const sel=new Set(selNames()); const avail=new Set([...sel,...buildableSet(P)]);
  const nSel=selCount();
  const score={};
  const chainOf=e=>DATA.evos.filter(m=>want(m)&&!done.has(m.id)&&m!==e&&P[m.name].how&&P[m.name].how[e.name]).length;
  const inRun=w=>Object.keys(w.req).filter(k=>sel.has(k)).length;
  // targets are {e, w}: the evolution and the way to build it that uses this pick
  for(const e of DATA.evos){ if(done.has(e.id)||!want(e)) continue; const b=P[e.name]; if(!b||b.total===0) continue; const seen=new Set();
    for(const w of b.alts) for(const x in w.missing){ if(seen.has(x)) continue; seen.add(x);
      const s=(score[x]=score[x]||{x,direct:[],near:[],chain:{},chainSum:0,nearSum:0,runSum:0}); const t={e,w,ws:b.alts.filter(v=>v.missing[x])};
      if(w.total===1){ s.direct.push(t); const c=chainOf(e); if(c){ s.chain[e.name]=c; s.chainSum+=c; } } else { s.near.push(t); s.nearSum+=1/(w.total-1); if(inRun(w)) s.runSum+=1/(w.total-1); } } }
  // closer targets first (a target one pick away after this one outweighs one that still needs three); on a tie, the one building on the run
  Object.values(score).forEach(s=>s.near.sort((a,b)=>a.w.total-b.w.total||inRun(b.w)-inRun(a.w)||tierOrder(a.e)-tierOrder(b.e)));
  // picks that build on the current run come before picks that only open fresh routes
  const tgt=s=>(s.direct[0]||s.near[0]).e.name;
  const picks=Object.values(score).filter(s=>!sel.has(s.x)).sort((a,b)=>b.direct.length-a.direct.length||b.chainSum-a.chainSum||b.runSum-a.runSum||b.nearSum-a.nearSum||b.near.length-a.near.length||nm(tgt(a)).localeCompare(nm(tgt(b)))||nm(a.x).localeCompare(nm(b.x)));
  const pb=picks.filter(s=>!isPassive(s.x)), pp=picks.filter(s=>isPassive(s.x));
  const lim=nSel?9:6;
  const pickGrid=(list,key)=>`<div class="picks">${list.slice(0,ui[key]?list.length:lim).map(s=>pickCard(s,false,P)).join('')}</div>${list.length>lim?`<button class="btn morebtn" data-tog="${key}">${ui[key]?T('showLess'):T('showAll')(list.length)}</button>`:''}`;
  const pickHtml=picks.length?`<section class="res"><h2>${T('picks')} <span class="n">${T('picksTag')}</span><small>${nSel?T('picksHelpSel'):T('picksHelpEmpty')}</small></h2>
    <div class="pickhelp"><span class="d"><b>${T('legendDirect')}:</b> ${T('legendDirectHelp')}</span><span class="nr"><b>${T('legendNear')}:</b> ${T('legendNearHelp')}</span></div>
    ${pb.length?`<h3 class="sub2">${T('pickBalls')} <button class="tg" data-tog="showPB">${ui.showPB?T('hide'):`${T('show')} (${pb.length})`}</button><span class="ln"></span></h3>${ui.showPB?pickGrid(pb,'allPB'):''}`:''}
    ${pp.length?`<h3 class="sub2">${T('pickPassives')} <button class="tg" data-tog="showPP">${ui.showPP?T('hide'):`${T('show')} (${pp.length})`}</button><span class="ln"></span></h3>${ui.showPP?pickGrid(pp,'allPP'):''}`:''}</section>`:'';
  // one-step merges: every ingredient of a recipe is in hand right now
  const direct=e=>e.recipes.find(r=>r.every(i=>sel.has(i)));
  const down=e=>DATA.evos.filter(m=>want(m)&&!done.has(m.id)&&m!==e&&P[m.name].how&&P[m.name].how[e.name]).sort((a,b)=>P[a.name].total-P[b.name].total);
  const can=DATA.evos.filter(e=>P[e.name].total===0&&!sel.has(e.name)&&(want(e)||down(e).length));
  const info={}; can.forEach(e=>{ const d=down(e); info[e.name]={d, score:(done.has(e.id)?0:100)+(d.length?50:0)-(d.length?Math.min(P[d[0].name].total,9):0)+d.length}; });
  can.sort((a,b)=>info[b.name].score-info[a.name].score||tierOrder(a)-tierOrder(b)||nm(a.name).localeCompare(nm(b.name)));
  const worth=e=>!done.has(e.id)||info[e.name].d.length>0;
  const canNew=can.filter(worth), canOld=can.filter(e=>!worth(e));
  const whyOf=e=>{ const d=info[e.name].d; const parts=[];
    if(d.length) parts.push(`<div class="nf">${T('neededFor')}</div>${d.slice(0,3).map(m=>{ const ms=Object.keys(P[m.name].missing); return `<div class="dl"><span class="dn" data-open="${esc(m.name)}">${mini(m.name)}${esc(nm(m.name))}</span><span class="dm">${ms.length?`${T('thenNeed')} ${ms.map(x=>`<span class="dn" data-open="${esc(x)}">${mini(x)}${esc(nm(x))}${P[m.name].missing[x]>1?' ×'+P[m.name].missing[x]:''}</span>`).join(' + ')}`:T('thenMissing')(0)}</span></div>`; }).join('')}${d.length>3?`<div class="dm">+${d.length-3}</div>`:''}`);
    const ps=parts.filter(Boolean); if(!ps.length&&done.has(e.id)) ps.push(`<i>${T('noGain')}</i>`); return ps.join(''); };
  // chains: a buildable evolution whose plan needs intermediate merges absorbs those intermediate cards
  const chainTarget={}; const absorbed=new Set();
  canNew.forEach(e=>{ if(direct(e)) return; planSteps(e.name,P[e.name].how).forEach(s=>{ if(s.t==='merge'&&s.res!==e.name){ absorbed.add(s.res); (chainTarget[s.res]=chainTarget[s.res]||[]).push(e.name); } }); });
  const directs=can.filter(e=>direct(e)&&worth(e));
  const conflictOf=e=>{ const r=direct(e); if(!r) return ''; const others=[];
    for(const i of r) directs.filter(o=>o!==e&&direct(o).includes(i)).forEach(o=>{ if(!others.includes(o)) others.push(o); });
    return others.length?`<div class="area cf" title="${esc(T('eitherOrHelp'))}"><span class="ml warn">${T('eitherOr')}</span><span class="cfl">${others.map(o=>`<span data-open="${esc(o.name)}">${esc(nm(o.name))}</span>`).join('<i>·</i>')}</span></div>`:''; };
  const card=e=>{ const dr=direct(e); if(dr) return cardHtml(e,{hl:sel,how:P[e.name].how,merge:true,why:whyOf(e)});
    const steps=planSteps(e.name,P[e.name].how); return chainCardHtml(e,steps,whyOf(e)); };
  const firsts=can.filter(e=>direct(e)&&worth(e)).slice(0,5);
  const lvl=firsts.length?`<div class="lvl"><div class="lt">${T('levelFirst')}</div><ol>${firsts.map(e=>`<li><div class="lm">${direct(e).map(i=>`<span class="dn" data-open="${esc(i)}">${mini(i)}${esc(nm(i))}</span>`).join('<span class="plus">+</span>')}<span class="arr">→</span><span class="dn" data-open="${esc(e.name)}">${mini(e.name)}${esc(nm(e.name))}</span>${done.has(e.id)?`<span class="st ok">✓ ${T('found')}</span>`:`<span class="st miss">${T('missingForYou')}</span>`}</div>${chainTarget[e.name]?`<div class="ln"><span class="o">${T('thenChain')}</span>${chainTarget[e.name].map(n=>`<span class="dn" data-open="${esc(n)}">${mini(n)}${esc(nm(n))}</span>`).join('')}</div>`:(done.has(e.id)&&info[e.name].d.length?`<div class="ln"><span>${T('ingFor')}</span>${info[e.name].d.slice(0,3).map(m=>`<span class="dn" data-open="${esc(m.name)}">${mini(m.name)}${esc(nm(m.name))}</span>`).join('')}</div>`:'')}</li>`).join('')}</ol></div>`:'';
  const poss=DATA.evos.filter(e=>want(e)&&P[e.name].total>0&&!done.has(e.id));
  poss.sort((a,b)=>P[a.name].total-P[b.name].total||tierOrder(a)-tierOrder(b)||nm(a.name).localeCompare(nm(b.name)));
  const canHtml=nSel?`<section class="res"><h2>${T('canNow')} <span class="n">${can.length}</span><small>${T('canNowHelp')}</small></h2>${lvl}
      <h3 class="sub2 g">${T('grpNew')} <span class="cnt">${canNew.filter(e=>!absorbed.has(e.name)).length}</span><span class="ln"></span></h3>
      ${canNew.length?`<div class="grid">${canNew.filter(e=>!absorbed.has(e.name)).map(card).join('')}</div>`:`<div class="empty">${T('canNowEmpty')}</div>`}
      <h3 class="sub2">${T('grpOld')} <span class="cnt">${canOld.length}</span> <button class="tg" data-tog="showOld">${ui.showOld?T('hide'):T('show')}</button><span class="ln"></span></h3>
      ${ui.showOld?(canOld.length?`<div class="grid">${canOld.map(card).join('')}</div>`:`<div class="empty">${T('none')}</div>`):''}</section>`:'';
  main.innerHTML=canHtml+pickHtml+
    `<section class="res"><h2>${T('possible')} <span class="n">${poss.length}</span><small>${T('possibleHelp')}</small></h2>
    ${poss.length?`<div class="grid">${poss.map(e=>cardHtml(e,{hl:avail,how:P[e.name].how,missing:P[e.name].missing,steps:planSteps(e.name,P[e.name].how)})).join('')}</div>`:`<div class="empty">${T('possibleEmpty')}</div>`}</section>`;
}
function renderAll(){ renderStatic(); renderProgress(); renderTools(); renderPicker(); renderMain(); const ex=$('#ioText'); if(ex) ex.value=exportCode(); }

function openDetail(n){
  const e=byName[n]; const m=$('#modal'); const d=$('#dlg');
  let html=`<button class="x" data-close aria-label="${T('close')}">×</button><div class="hero"><img class="sprite" src="${spr(n)}" alt=""><div class="t">`;
  if(e){ const dn=done.has(e.id);
    html+=`<span class="kind">${tierLabel(e.tier)} · ${T('evolution')}</span><h3>${esc(nm(n))}${e.new?`<span class="star" title="${T('natTitle')}">★ Naturalist</span>`:''}</h3>${alt(n)!==nm(n)?`<div class="en">${esc(alt(n))}</div>`:''}
      <div class="badges"><span class="badge ${dn?'ok':'miss'}">${dn?'✓ '+T('found'):T('missingForYou')}</span>${ui.sel[n]?`<span class="badge run">✓ ${T('stInRun')}</span>`:''}</div>
      <div class="acts"><button class="btn ${dn?'':'primary'}" data-toggle="${e.id}" data-keep="1">${dn?T('markMissing'):T('markFound')}</button><button class="btn" data-${ui.sel[n]?'dec':'ing'}="${esc(n)}" data-keep="1">${ui.sel[n]?T('outRun'):T('addRun')}</button></div>${(ui.lang==='de'?e.note:e.noteEn)?`<div class="note" style="font-size:12px;color:var(--fg3)">${esc(ui.lang==='de'?e.note:e.noteEn)}</div>`:''}</div></div>`;
    html+=`<h4>${T('recipe')}</h4><div class="recs">${e.recipes.map((r,ri)=>recipeHtml(r,ri)).join('')}</div>`;
    const st=subTree(e,null,0); if(st) html+=`<h4>${T('craftIng')}</h4>${st}`;
  } else {
    const x=byEntry[n], dn=x&&done.has(x.id), pick=DATA.base.includes(n)||PICK_P.includes(n);
    html+=`<span class="kind">${x&&x.kind==='passive'?T('basePassive'):T('baseBall')}</span><h3>${esc(nm(n))}${x&&x.new?`<span class="star" title="${T('natTitle')}">★ Naturalist</span>`:''}</h3>${alt(n)!==nm(n)?`<div class="en">${esc(alt(n))}</div>`:''}
      <div class="badges">${x?`<span class="badge ${dn?'ok':'miss'}">${dn?'✓ '+T('found'):T('missingForYou')}</span>`:''}${pick?(ui.sel[n]?`<span class="badge run">✓ ${T('stInRun')}</span>`:`<span class="badge">${T('stNotInRun')}</span>`):''}</div>
      <div class="acts">${x?`<button class="btn ${dn?'':'primary'}" data-toggle="${x.id}" data-keep="1">${dn?T('markMissing'):T('markFound')}</button>`:''}${pick?`<button class="btn" data-${ui.sel[n]?'dec':'ing'}="${esc(n)}" data-keep="1">${ui.sel[n]?T('outRun'):T('addRun')}</button>`:''}</div></div></div>${condHtml(n)?`<div class="dcond">${condHtml(n)}</div>`:''}`;
  }
  const uses=(usedIn[n]||[]).slice().sort((a,b)=>(done.has(a.e.id)-done.has(b.e.id)));
  if(uses.length){ html+=`<h4>${T('usedFor')}</h4><div class="uses">${uses.map(u=>{ const others=u.r.filter(x=>x!==n); return `<span class="use ${done.has(u.e.id)?'done':''}" data-open="${esc(u.e.name)}"><img class="sprite" src="${spr(u.e.name)}" alt=""><span><b>${esc(nm(u.e.name))}</b> <span class="w">${T('with')} ${others.map(nm).map(esc).join(' + ')}${done.has(u.e.id)?' · ✓':''}</span></span></span>`; }).join('')}</div>`; }
  d.innerHTML=html; m.classList.add('on'); d.dataset.name=n; d.querySelector('.x').focus();
}
function closeDetail(){ $('#modal').classList.remove('on'); }

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-markseen],[data-tact],[data-n],[data-m],[data-mergeok],[data-merge],[data-undo],[data-tog],[data-toggle],[data-open],[data-dec],[data-ing],[data-t],[data-f],[data-l],[data-close],#onlyNew,#clearSel,#togP,#togE,#togH,#ioBtn,#resetBtn,#copyBtn,#loadBtn,#modal');
  if(!t) return;
  if(t.dataset.markseen!==undefined){ const ns=t.dataset.markseen.split('|').filter(n=>entryOf(n));
    act(T('hMark')(ns.map(nm).join(', ')),()=>ns.forEach(n=>done.add(entryOf(n).id))); renderAll();
    const row=t.closest('.trow'); if(row) row.innerHTML=`<span class="tl ok">✓ ${T('seenDone')}</span>${ns.map(n=>tsp(n,'new')).join('')}`; return; }
  if(t.dataset.merge!==undefined&&t.dataset.tact){ $('#toast').classList.remove('on'); doMerge(t.dataset.merge); return; }
  if(t.dataset.tact){ const a=t.dataset.tact; const el=$('#toast');
    if(a==='scrollRes'){ const s=document.querySelector('.res'); if(s) s.scrollIntoView({behavior:'smooth',block:'start'}); }
    if(a==='scrollRun'){ const s=document.querySelector('.picker'); if(s) s.scrollIntoView({behavior:'smooth',block:'start'}); }
    if(a==='undoLast'){ undoTo(hist.length-1); }
    if(el) el.classList.remove('on'); return; }
  if(t.dataset.mergeok!==undefined){ try{localStorage.setItem(KEY+'-mergeinfo','1')}catch(x){} closeDetail(); const id=t.dataset.mergeok; const e=byId[id]; const r=e.recipes.find(r=>r.every(i=>ui.sel[i]));
    if(r){ act(T('hMerge')(nm(e.name)),()=>{ r.forEach(i=>delete ui.sel[i]); ui.sel[e.name]=1; done.add(e.id); }); renderAll(); mergeToast(e,r); } return; }
  if(t.dataset.merge!==undefined){ doMerge(t.dataset.merge); return; }
  if(t.dataset.undo!==undefined){ undoTo(Number(t.dataset.undo)); return; }
  if(t.dataset.tog){ ui[t.dataset.tog]=!ui[t.dataset.tog]; saveUi(); renderMain(); return; }
  if(t.id==='togH'){ ui.showH=!ui.showH; renderHist(); return; }
  if(t.dataset.toggle!==undefined){ toggle(t.dataset.toggle); if(t.dataset.keep) openDetail($('#dlg').dataset.name); return; }
  if(t.dataset.open!==undefined){ openDetail(t.dataset.open); return; }
  if(t.dataset.dec!==undefined){ const i=t.dataset.dec; act(T('hRemove')(nm(i)),()=>addSel(i,-1)); renderPicker(); renderMain(); if(t.dataset.keep) openDetail(i); return; }
  if(t.dataset.ing!==undefined){ const i=t.dataset.ing; const anc=t.closest('section.res'); const ancTop=anc?anc.querySelector('h2').getBoundingClientRect().top:null;
    act(T('hAdd')(nm(i)),()=>addSel(i,1)); ui.lastAdded=i; renderPicker(); renderMain();
    if(ancTop!==null){ const h=[...document.querySelectorAll('section.res h2')].find(x=>x.textContent.startsWith(T('picks'))); if(h) window.scrollBy(0,h.getBoundingClientRect().top-ancTop); }
    if(t.dataset.keep) openDetail(i);
    else { const P2=plan(ui.sel); const now=DATA.evos.filter(x=>P2[x.name].total===0&&!ui.sel[x.name]&&x.recipes.some(r=>r.includes(i))&&!done.has(x.id));
      const seen=seenRow(unseen([i]));
      if(now.length||seen) toast(`${now.length?`<div class="thead">${tsp(i,'in')}<span class="tl">${T('tInRun')}</span><span class="tarr">→</span>${now.slice(0,3).map(x=>tsp(x.name,'new')).join('')}<span class="tl ok">${T('tNowBuildable')}</span></div>`:''}${seen}`, now.length?[{label:T('tShow'),act:'scrollRes'}]:[]); } return; }
  if(t.id==='modal'||t.dataset.close!==undefined){ if(t.id==='modal'&&ev.target!==t) return; closeDetail(); return; }
  if(t.dataset.t){ const v=t.dataset.t; ui.tier=['all','p','b','bp'].includes(v)?v:Number(v); saveUi(); renderTools(); renderMain(); return; }
  if(t.dataset.f){ ui.filter=t.dataset.f; saveUi(); renderTools(); renderMain(); return; }
  if(t.dataset.l){ ui.lang=t.dataset.l; saveUi(); renderAll(); return; }
  if(t.dataset.m){ ui.mode=t.dataset.m; saveUi(); renderTools(); renderMain(); window.scrollTo({top:0}); return; }
  if(t.dataset.n){ ui.newF=t.dataset.n; saveUi(); renderTools(); renderPicker(); renderMain(); return; }
  if(t.id==='clearSel'){ act(T('hClear'),()=>{ui.sel={}}); renderPicker(); renderMain(); return; }
  if(t.id==='togP'){ ui.showP=!ui.showP; saveUi(); renderPicker(); return; }
  if(t.id==='togE'){ ui.showE=!ui.showE; saveUi(); renderPicker(); return; }
  if(t.id==='copyBtn'){ const ta=$('#ioText'); ta.value=exportCode();
    const ok=()=>{$('#ioMsg').textContent=T('copied')}; const fb=()=>{ta.focus();ta.select();$('#ioMsg').textContent=T('selected')};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok,fb); else fb(); return; }
  if(t.id==='loadBtn'){ try{ const raw=JSON.parse($('#ioIn').value); const arr=Array.isArray(raw)?raw:raw.done; if(!Array.isArray(arr)) throw 0; const valid=arr.filter(id=>byId[id]);
      const nsel={}; if(!Array.isArray(raw)&&raw.sel&&typeof raw.sel==='object') Object.keys(raw.sel).forEach(n=>{ if(IMG[n]||byEntry[n]) nsel[n]=1; });
      act(T('hLoad'),()=>{ done=new Set(valid); if(!Array.isArray(raw)) ui.sel=nsel; }); if(!Array.isArray(raw)&&Array.isArray(raw.hist)) { hist=raw.hist.slice(-40); saveHist(); }
      renderAll(); $('#ioIn').value=''; $('#ioMsg2').textContent=T('loaded')(valid.length)+(Object.keys(nsel).length?` · ${T('loadedRun')(Object.keys(nsel).length)}`:''); }
    catch(e){ $('#ioMsg2').textContent=T('badCode'); } return; }
  if(t.id==='resetBtn'){ if(t.dataset.arm){ act(T('hReset'),()=>{ done=new Set(); ui.sel={}; }); renderAll(); delete t.dataset.arm; }
    else { t.dataset.arm='1'; t.textContent=T('resetArm'); setTimeout(()=>{delete t.dataset.arm; t.textContent=T('reset');},4000); } return; }
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape') closeDetail(); });
function toggle(id){ const was=done.has(id); act((was?T('hUnmark'):T('hMark'))(nm(byId[id].name)),()=>{ if(was) done.delete(id); else done.add(id); }); renderProgress(); renderPicker(); renderMain(); }
$('#q').addEventListener('input',ev=>{ ui.q=ev.target.value.trim(); renderMain(); });
renderAll();
</script>

.cs-s{font-size:12px;color:var(--fg3)}
.cstep.now .cs-s{color:var(--ok);font-weight:600}
